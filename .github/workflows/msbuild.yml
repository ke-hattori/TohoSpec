name: MSBuild (VS2022)

on:
  push:
    branches: [ feature/vs2022 ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cfg: [Debug, Release]
        plat: [x86, x64]

    env:
      SOLUTION_PATH: NANOSPEC.sln
      BINLOG: build-${{ matrix.plat }}-${{ matrix.cfg }}.binlog
      BUILD_LOG: build-${{ matrix.plat }}-${{ matrix.cfg }}.log
      ERR_LOG: errors-${{ matrix.plat }}-${{ matrix.cfg }}.log
      WARN_LOG: warnings-${{ matrix.plat }}-${{ matrix.cfg }}.log
      WARN_SUM: warnings-summary-${{ matrix.plat }}-${{ matrix.cfg }}.csv

    steps:
      - name: Checkout (with submodules & LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Setup MSBuild (vswhere)
        uses: microsoft/setup-msbuild@v2

      - name: Restore (NuGet via MSBuild)
        run: msbuild ".\${{ env.SOLUTION_PATH }}" -t:Restore
        shell: pwsh

      - name: Build ${{ matrix.plat }} / ${{ matrix.cfg }}
        run: >
          msbuild ".\${{ env.SOLUTION_PATH }}" /m
          /p:Configuration=${{ matrix.cfg }} /p:Platform=${{ matrix.plat }}
          /bl:${{ env.BINLOG }}
          /flp1:"logfile=${{ env.BUILD_LOG }};verbosity=diagnostic"
          /flp2:"logfile=${{ env.ERR_LOG }};errorsonly=true"
          /flp3:"logfile=${{ env.WARN_LOG }};warningsonly=true"
        shell: pwsh

      - name: Summarize warnings by code
        if: always()
        shell: pwsh
        run: |
          $pat = ':\s*warning\s+(C\d{4,5})'
          $t = @{}
          if (Test-Path "${{ env.WARN_LOG }}") {
            Get-Content "${{ env.WARN_LOG }}" | ForEach-Object {
              if ($_ -match $pat) { $code = $Matches[1]; $t[$code] = 1 + ($t[$code] ?? 0) }
            }
          }
          $lines = @("code,count")
          foreach ($k in ($t.Keys | Sort-Object {[int]($_ -replace '^C','')})) { $lines += "$k,$($t[$k])" }
          $csv = $lines -join "`n"
          $csv | Out-File "${{ env.WARN_SUM }}" -Encoding utf8
          $totalW = (Test-Path "${{ env.WARN_LOG }}") ? ((Get-Content "${{ env.WARN_LOG }}" | Measure-Object -Line).Lines) : 0
          $totalE = (Test-Path "${{ env.ERR_LOG }}") ? ((Get-Content "${{ env.ERR_LOG }}" | Measure-Object -Line).Lines) : 0
          "### ${env:GITHUB_JOB} ${{ matrix.plat }}/${{ matrix.cfg }} Summary`n- Errors: $totalE`n- Warnings: $totalW" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload logs (${{ matrix.plat }}-${{ matrix.cfg }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-logs-${{ matrix.plat }}-${{ matrix.cfg }}
          path: |
            ${{ env.BINLOG }}
            ${{ env.BUILD_LOG }}
            ${{ env.ERR_LOG }}
            ${{ env.WARN_LOG }}
            ${{ env.WARN_SUM }}
