; 通信フォーマット ---------------------------------------------------
[COM]
; ポート No.
;	デフォルト値 =3
No=1
; ボーレート	範囲：	110，300，600，1200，2400，4800，9600，14400，
			19200，38400，56000，57600，115200，128000，256000
;	デフォルト値 =38400
BaudRate=38400
; データ長
;	デフォルト値 =8		範囲：4 ～ 8
ByteSize=8
; パリティ
;	0：無し
;	1：奇数パリティ
;	2：偶数パリティ
;	3：マークパリティ
;	4：スペースパリティ
;	デフォルト値 =0
Parity=0
; ストップビット
;	0：1
;	1：1.5
;	2：2
;	デフォルト値 =0
StopBits=0

; 通信ログ設定 -------------------------------------------------------
[ComLog]
; ログのディレクトリ指定
;	指定無し，異常パスの場合は MotSysDef.ini の場所になります．
;	最後に必ず '\' を付けてください．
Path=..\log\
; ログのファイル名
;	デフォルト値 =MSComLog
FileName=MSComLog
